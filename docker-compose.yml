services:
  web:
    build: .
    ports: ['3000:3000']
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
  api:
    build: ./backend
    ports: ['8000:8000']
    depends_on: [postgres, redis]
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_PASSWORD: climateverse
      POSTGRES_DB: climateverse
    ports: ['5432:5432']
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
