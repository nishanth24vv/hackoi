apiVersion: apps/v1
kind: Deployment
metadata: { name: climateverse-web }
spec:
  replicas: 3
  selector: { matchLabels: { app: climateverse-web } }
  template:
    metadata: { labels: { app: climateverse-web } }
    spec:
      containers:
        - name: web
          image: climateverse/web:latest
          ports: [{ containerPort: 3000 }]
---
apiVersion: v1
kind: Service
metadata: { name: climateverse-web }
spec:
  selector: { app: climateverse-web }
  ports: [{ port: 80, targetPort: 3000 }]
